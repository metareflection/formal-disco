_target_: scheduler.RoundRobinScheduler

turn_fuel: 5

workers:
  - _target_: worker.proof_worker.ProofWorker
    language: lean
    domain: group_theory
    max_attempts: 3
    max_strategies: 2
    interest_success: 3.0
    interest_fail: 0.7
    interest_recursion_gamma: 0.5
    lake_project_dir: ${oc.env:LEAN_PROJECT_DIR}
    llm:
      _target_: langchain_google_vertexai.model_garden.ChatAnthropicVertex
      model: claude-opus-4-6
      project: ${oc.env:GCP_PROJECT_ID,formal-disco}
      location: ${oc.env:GCP_LOCATION,global}
      max_tokens: 10000

  - _target_: worker.proof_repair_worker.ProofRepairWorker
    language: lean
    domain: group_theory
    max_attempts: 3
    interest_success: 3.0
    interest_fail: 0.7
    interest_recursion_gamma: 0.5
    lake_project_dir: ${oc.env:LEAN_PROJECT_DIR}
    llm:
      _target_: langchain_google_vertexai.model_garden.ChatAnthropicVertex
      model: claude-opus-4-6
      project: ${oc.env:GCP_PROJECT_ID,formal-disco}
      location: ${oc.env:GCP_LOCATION,global}
      max_tokens: 10000

  - _target_: worker.reflection_worker.ReflectionWorker
    domain: group_theory
    interest_success_boost: 1.3
    interest_failure_decay: 0.8
    min_attempts_for_kill: 10
    kill_threshold: 0.05
    llm:
      _target_: langchain_google_vertexai.model_garden.ChatAnthropicVertex
      model: claude-sonnet-4-6
      project: ${oc.env:GCP_PROJECT_ID,formal-disco}
      location: ${oc.env:GCP_LOCATION,global}
      max_tokens: 8000
